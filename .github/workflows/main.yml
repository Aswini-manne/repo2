name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main  # Set this to your default branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      # If you use Node.js, you can add Node setup and install steps here

      # Add other build steps here if needed, for example:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '18'
      # - run: npm install
      # - run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # For PR status
          action: "upload"
          #### You might need to change these based on your app structure
          #### For static HTML, these can be left blank
          #### For frameworks, set appropriately
          #### E.g., for React: app_location: "/"
          ####       output_location: "build"
          app_location: "/" # Location of your app source code
          api_location: ""  # Location of your Azure Functions code (if any)
          output_location: "" # Built app content directory (if any)
